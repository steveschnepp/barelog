name: Build barelog (all platforms)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        platform: [atmega328p, ch32v203, rp2040, nrf52840, esp32s3]
      fail-fast: true
      max-parallel: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Base image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.base
          push: false
          tags: barelog:base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image
        run: bash inline_base.sh Dockerfile.${{ matrix.platform }} Dockerfile.base

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.${{ matrix.platform }}
          push: false
          load: true
          tags: barelog:${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ${{ matrix.platform }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            barelog:${{ matrix.platform }} \
            make PLATFORM=${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: barelog-${{ matrix.platform }}
          path: build_${{ matrix.platform }}/barelog.*
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for trailing whitespace
        run: |
          if grep -r ' $' --include='*.c' --include='*.h' .; then
            echo "Error: trailing whitespace found"
            exit 0
          fi

      - name: Check for tabs
        run: |
          if grep -r $'\t' --include='*.c' --include='*.h' .; then
            echo "Error: tabs found (use spaces)"
            exit 0
          fi

      - name: Check Makefile format
        run: |
          if grep -v '^[[:space:]]*#' Makefile | grep '^[^ ]' | grep -v ':' | head -1; then
            echo "Makefile should use tabs for rules"
          fi
